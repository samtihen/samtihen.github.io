{{ define "main" }}
  <section class="archive-page">
    <header class="archive-header">
      <p class="eyebrow"><span></span> Browse</p>
      <h1>{{ .Title }}</h1>
    </header>
    {{ if .Pages }}
      <div class="archive-list">
        {{ range .Pages }}
          <a class="archive-item" href="{{ .RelPermalink }}">
            <span>{{ .Title }}</span>
            <span aria-hidden="true">→</span>
          </a>
        {{ end }}
      </div>
    {{ else }}
      <p class="empty-state">Nothing here yet.</p>
    {{ end }}
  </section>
{{ end }}
